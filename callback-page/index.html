<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Returning to Personal Expense Tracker</title>
  <style>
    :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --accent: #5b4ef0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --muted: #a1a1a6; --accent: #8d7aff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; text-align: center; }
    main { padding: 32px 24px; max-width: 420px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 28px; }
    a { display: inline-block; padding: 14px 28px; border-radius: 999px; background: var(--accent); color: #fff;
        text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Bank approved</h1>
    <p>Taking you back to Personal Expense Tracker…</p>
    <a id="open" href="personalexpensetracker://bank-callback">Open the app</a>
  </main>
  <script>
    // Enable Banking sends the approval code here; hand it straight to the app.
    var target = "personalexpensetracker://bank-callback" + window.location.search;
    document.getElementById("open").href = target;
    window.location.replace(target);
  </script>
</body>
</html>
